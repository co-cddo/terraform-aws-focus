name: Create Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version bump type'
        required: true
        default: 'minor'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Validate increment input
        run: |
          if [[ "${{ inputs.increment }}" != "major" && "${{ inputs.increment }}" != "minor" && "${{ inputs.increment }}" != "patch" ]]; then
            echo "Error: 'increment' must be 'major', 'minor', or 'patch', got '${{ inputs.increment }}'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          INCREMENT="${{ inputs.increment }}"

          if [ "$INCREMENT" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$INCREMENT" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$INCREMENT" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          GENERATED_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name=${{ env.NEW_TAG }} \
            ${PREVIOUS_TAG:+-f previous_tag_name=$PREVIOUS_TAG} \
            --jq .body)

          cat <<EOF > release_notes.md
          Released by @${{ github.actor }}

          ${GENERATED_NOTES}
          EOF

          gh release create ${{ env.NEW_TAG }} \
            --title "${{ env.NEW_TAG }}" \
            --notes-file release_notes.md \
            --latest
